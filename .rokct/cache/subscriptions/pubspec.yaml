name: subscriptions_sdk
description: "Merchant and POS subscription plans, feature toggling matrices, payment link integration, and active state tracking."
version: 1.8.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  drift: ^2.19.0
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^3.1.0
  pull_to_refresh: ^2.0.0
  get_it: ^8.0.0
  dio: ^5.7.0
  # Icon standard (.rokct/decision_log.md "Icon package standard").
  remixicon: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  # Test-only: the demo-session provider test seeds LocalStorage through
  # SharedPreferences.setMockInitialValues before LocalStorage.init, so
  # DemoSession.activate/clear actually persist. Same pin base_sdk uses,
  # which already brings the package into the resolved universe — this
  # declares the direct test import rather than adding a dependency.
  shared_preferences: ^2.5.2

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../base