name: fav_sdk
description: A generic and reusable favorites/bookmarking engine.
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  flutter_riverpod: ^2.5.1
  # Must match base_sdk's freezed 3.x line: base pins freezed_annotation
  # ^3.1.0, and a ^2.4.4 floor here makes this package UNRESOLVABLE next to
  # ../base - the composer's per-cache codegen then skips fav_sdk entirely
  # and favorites_state.freezed.dart is never generated (guided tour run
  # 32963442435: "fav_sdk does not resolve standalone; skipping its codegen").
  freezed_annotation: ^3.1.0
  get_it: ^8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^3.2.3

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../base