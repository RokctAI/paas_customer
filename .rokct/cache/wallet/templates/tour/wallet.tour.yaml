# Guided-tour fragment for wallet_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the one screen
# wallet_sdk installs: the wallet top-up at /wallet-topup (manifest.json
# routes, WalletTopUpRoute — a parameter-less route view).
#
# No demo seed needed: the screen's amount presets and amount field render
# entirely locally; the saved-card picker degrades gracefully to its
# no-saved-cards state when the platform gateway is unreachable (its
# fetch failure surfaces as one friendly line, detail to telemetry), which
# is truthful for a fresh account.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: wallet
steps:
  - key: wallet_topup
    title: "Top up in seconds"
    caption: "Pick an amount, pick a card, done - *money in your wallet* in seconds."
    action: route
    route: /wallet-topup
    settle: 7
