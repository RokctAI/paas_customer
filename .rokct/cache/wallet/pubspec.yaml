name: wallet_sdk
description: "wallet_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.6.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  flutter_screenutil: ^5.9.0
  # Constraints match base_sdk's (these were already in the resolution
  # transitively; declared here because wallet_sdk imports them directly
  # since the profile wallet card / history / send surfaces moved in).
  auto_route: ^9.2.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  pull_to_refresh: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: the gateway wire test scripts Dio's HttpClientAdapter to
  # capture the real request path/body. Same pin as base_sdk's, already in
  # the resolution transitively.
  dio: ^5.7.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../base