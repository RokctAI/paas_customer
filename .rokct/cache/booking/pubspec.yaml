name: booking_sdk
description: "booking_sdk - table reservations (customer flow + seller management), recovered from paas_customer / paas_pos."
version: 1.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  get_it: ^8.0.0
  intl: ^0.19.0
  remixicon: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

# Workspace-relative override so this package resolves standalone for
# analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  http: ^1.2.0
  base_sdk:
    path: ../../../core/base/dart
